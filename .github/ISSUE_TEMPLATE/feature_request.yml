name: Feature request
description: An idea for what it should do next.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This plugin does one thing on purpose: it records the questions and answers verbatim and never summarizes. Ideas that keep that shape land best.

  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: The situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind (optional)

  - type: textarea
    id: workaround
    attributes:
      label: How you work around it today (optional)
      description: The workaround often says more about the problem than the idea does.

  - type: markdown
    attributes:
      value: |
        Two things are out of scope by design, see [ROADMAP.md](https://github.com/didongke/ai-tracedoc-mods/blob/main/ROADMAP.md): recording tool calls, thinking or system notices, and any telemetry or network call.

  - type: checkboxes
    id: fit
    attributes:
      label: Shape
      options:
        - label: This keeps the record verbatim — no model calls, no summaries
